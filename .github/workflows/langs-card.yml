# Redraws assets/langs.svg (Most Used Languages leaderboard) once a day, and whenever you run it by hand
# from the Actions tab. It only commits when the numbers actually changed.
name: Update languages card

on:
  schedule:
    - cron: "17 6 * * *" # every day at 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write # to commit the updated card

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Draw the card
        run: node scripts/langs-card.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if it changed
        run: |
          if git ls-files --error-unmatch assets/langs.svg >/dev/null 2>&1 && git diff --quiet -- assets/langs.svg; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/langs.svg
          git commit -m "Update languages card"
          git push
